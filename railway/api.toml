# ============================================================================
# api（Spring Boot）。業務 API とスキーマの所有者。
#
# ★ Railway のサービス設定 → Config as Code に、このファイルのパスを指定する。
#   指定しないと Railway はリポジトリのルートに Dockerfile を探し、
#   「couldn't locate the dockerfile at path Dockerfile」で失敗する。
#   この構成はルートに Dockerfile を置いていない（5 サービスあるため）。
#
# ★ ビルドコンテキストは常にリポジトリのルート。
#   api / voice / web の Dockerfile すべてがその前提で書かれている。
# ============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "api/Dockerfile"

[deploy]
# ★ 起動時に Flyway がマイグレーションを流す。voice より先に上げること。
#   startCommand は書かない（イメージの ENTRYPOINT をそのまま使う）。
healthcheckPath = "/actuator/health"
# Flyway の実行と JVM の起動で時間がかかる。短いと通る前に殺される
healthcheckTimeout = 300

# ★ 既定の 10 から 3 に下げてある。設定不足で落ちるとき 10 回粘られると、
#   「延々デプロイし続けている」ようにしか見えない。
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

numReplicas = 1
