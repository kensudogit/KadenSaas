# ============================================================================
# voice-media（FastAPI）。Media Streams の WebSocket。
#
# ★ Railway のサービス設定 → Config as Code に、このファイルのパスを指定する。
#   指定しないと Railway はリポジトリのルートに Dockerfile を探し、
#   「couldn't locate the dockerfile at path Dockerfile」で失敗する。
#   この構成はルートに Dockerfile を置いていない（5 サービスあるため）。
#
# ★ ビルドコンテキストは常にリポジトリのルート。
#   api / voice / web の Dockerfile すべてがその前提で書かれている。
# ============================================================================

# ★ voice-web と必ず別サービスにする。Media Streams は 1 通話あたり
#   毎秒 50 メッセージで、同居させると同時通話が増えるほど webhook の
#   応答が遅れ、Twilio が再送を始める。負荷が高いときに、いちばん
#   壊れてほしくない経路（通話の状態記録）が最初に壊れる。
#   スケールの軸も違う（webhook は同時ユーザー数、media は同時通話数）。
#
# ★ このサービスの変数に PORT と MEDIA_PORT を同じ値で入れること。
#   entrypoint の media は MEDIA_PORT を見て bind するので、
#   ずれると Railway が待つポートと合わずヘルスチェックが通らない。

[build]
builder = "DOCKERFILE"
dockerfilePath = "voice/Dockerfile"

[deploy]
startCommand = "entrypoint media"

healthcheckPath = "/healthz"
healthcheckTimeout = 120

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

numReplicas = 1
