# ============================================================================
# voice-web（FastAPI）。Twilio の webhook と内部 API。
#
# ★ Railway のサービス設定 → Config as Code に、このファイルのパスを指定する。
#   指定しないと Railway はリポジトリのルートに Dockerfile を探し、
#   「couldn't locate the dockerfile at path Dockerfile」で失敗する。
#   この構成はルートに Dockerfile を置いていない（5 サービスあるため）。
#
# ★ ビルドコンテキストは常にリポジトリのルート。
#   api / voice / web の Dockerfile すべてがその前提で書かれている。
# ============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "voice/Dockerfile"

[deploy]
# entrypoint の web 分岐。ENTRYPOINT が残る／外れるのどちらでも通る
startCommand = "entrypoint web"

healthcheckPath = "/healthz"
healthcheckTimeout = 120

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

numReplicas = 1
